# Release — Create GitHub Release + publish to npm
#
# Triggered by pushing a version tag (e.g., v0.8.0).
# 1. Verifies checksums, tag/package.json version sync, and runs the full smoke test suite
# 2. Creates a GitHub Release with tarball
# 3. Publishes to npm registry

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify checksums
        run: shasum -a 256 -c checksums.sha256

      - name: Verify version sync (tag vs package.json)
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          PKG_VER=$(jq -r .version package.json)
          if [[ "$TAG_VER" != "$PKG_VER" ]]; then
            echo "Version mismatch: tag=v${TAG_VER} but package.json=${PKG_VER}"
            echo "Bump package.json (and CHANGELOG) before tagging, or retag."
            exit 1
          fi
          echo "Version sync OK: ${TAG_VER}"

      - name: Run smoke tests
        env:
          MULTI_AI_LOG_DIR: ${{ runner.temp }}/prism-logs
        run: ./tests/smoke-test.sh

      - name: Create release tarball
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          tar czf "claude-prism-${VERSION}.tar.gz" \
            commands/ scripts/ bin/ \
            install.sh uninstall.sh checksums.sha256 \
            package.json LICENSE README.md
          shasum -a 256 "claude-prism-${VERSION}.tar.gz" > "claude-prism-${VERSION}.tar.gz.sha256"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "claude-prism-${VERSION}.tar.gz" \
            "claude-prism-${VERSION}.tar.gz.sha256" \
            --generate-notes

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
