# ShellCheck — Static analysis for shell scripts
#
# Runs on every PR and push to main.
# Catches common shell scripting bugs, security issues, and style problems.

name: ShellCheck

on:
  push:
    branches: [main]
    paths: ['**/*.sh']
  pull_request:
    paths: ['**/*.sh']

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          severity: warning
